<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codemap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E7ECF0;--grid:rgba(20,34,48,.07);--panel:#FBFCFD;--panel2:#EEF2F5;--card:#fff;--gutter:#EEF2F6;--ink:#142230;--ink2:#566676;--ink3:#8795A3;--line:#CBD5DD;--accent:#1F5FBF;--accent-ink:#fff;
--c-if:#C9731A;--c-loop:#7B58D9;--c-switch:#B0408F;--c-try:#17897B;--c-ret:#CF4255;--c-stmt:#4A6A8C;--c-call:#2F9E62;--c-true:#1E9A6B;--c-false:#CF4255;
--tk-k:#7B3FC4;--tk-s:#1C8A55;--tk-c:#8795A3;--tk-n:#C2631B;--tk-f:#1F5FBF;--tk-t:#0E7C86;
--shadow:0 1px 2px rgba(20,34,48,.08),0 8px 24px rgba(20,34,48,.10);
--ui:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;--mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
[data-theme=dark]{--bg:#0D1520;--grid:rgba(255,255,255,.045);--panel:#142030;--panel2:#1A2A3B;--card:#172636;--gutter:#1D2E40;--ink:#E6EDF3;--ink2:#9FB2C2;--ink3:#6B8296;--line:#2A3D50;--accent:#5B9BFF;--accent-ink:#06121F;
--c-if:#F0A04B;--c-loop:#A68BFF;--c-switch:#E27BC4;--c-try:#3CC7B5;--c-ret:#FF7A8A;--c-stmt:#7FA3C7;--c-call:#4FCB86;--c-true:#4FCB86;--c-false:#FF7A8A;
--tk-k:#B794F6;--tk-s:#6FD9A0;--tk-c:#6B8296;--tk-n:#F0A04B;--tk-f:#7FB2FF;--tk-t:#4FD0DA;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font:14px/1.55 var(--ui);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-block-end:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand small{font-weight:400;color:var(--ink2)}
.grow{flex:1}
.ico,.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ico{width:34px;height:34px;padding:0}
.chip{padding:5px 12px;border-radius:999px;white-space:nowrap}
.ico:hover,.chip:hover{border-color:var(--accent)}
.chip.on,.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stats{display:flex;gap:6px;color:var(--ink2);font-size:13px}
.stats span{padding:2px 9px;border-radius:999px;background:var(--panel2)}
.progress{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
.progress i{display:block;width:90px;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
.progress i b{display:block;height:100%;width:0;background:var(--c-call);transition:width .3s}
#main{display:flex;min-height:0;position:relative}
#drawer{width:380px;flex:none;background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:10}
#drawer.closed{display:none}
.tabs{display:flex;border-block-end:1px solid var(--line)}
.tabs button{flex:1;padding:10px 6px;border:0;background:none;border-block-end:2px solid transparent;color:var(--ink2)}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.pane{padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1}
textarea#src{flex:1;min-height:200px;resize:none;direction:ltr;text-align:left;font:12.5px/1.55 var(--mono);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);tab-size:2}
input[type=text],input[type=search],input[type=number],input[type=password],select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.primary:hover{filter:brightness(1.08)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:22px 12px;text-align:center;color:var(--ink2)}
.drop.over{border-color:var(--accent);background:var(--panel2)}
.hint{color:var(--ink2);font-size:12.5px;margin:0}
.msg{margin:0;padding:0 14px 12px;font-size:13px;color:var(--ink2)}
.msg.err{color:var(--c-ret)}
.bar{height:4px;border-radius:2px;background:var(--panel2);overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--accent)}
#overview,#fnpage{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-block-end:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:5px 12px}
.seg button+button{border-inline-start:1px solid var(--line)}
.canvas{position:relative;flex:1;min-height:0;overflow:hidden;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
svg.cv{width:100%;height:100%;display:block;touch-action:none;direction:ltr;user-select:none;-webkit-user-select:none}
.legend{position:absolute;inset-inline-start:12px;inset-block-end:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:12.5px;max-width:300px;max-height:60%;overflow:auto}
.legend h4{margin:0 0 6px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0;color:var(--ink2)}
.legend i{width:14px;height:10px;border-radius:3px;display:inline-block;flex:none}
.legend .fl{cursor:pointer}
.legend .fl.on{color:var(--ink);font-weight:600}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);text-align:center;padding:20px;pointer-events:none}
.rel{max-height:34%;overflow:auto;background:var(--panel);border-block-start:1px solid var(--line);padding:10px 14px;font-size:13px}
.rel h4{margin:0 0 6px}
.rel ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.rel li{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;color:var(--ink2)}
.rel a{color:var(--accent);cursor:pointer;font-family:var(--mono);font-size:12.5px;text-decoration:none}
.rel a:hover{text-decoration:underline}
.fnbody{flex:1;display:flex;min-height:0}
#side{width:350px;flex:none;border-inline-start:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#side .tabs button{padding:8px 4px}
.sidepane{padding:12px 14px;overflow:auto;flex:1;min-height:0}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;color:#fff;font-size:12px;font-family:var(--mono)}
.sidepane h5{margin:14px 0 6px;font-size:13px;color:var(--ink2);font-weight:500}
.sidepane p{margin:6px 0}
.lnk{display:inline-flex;margin:2px 4px 2px 0;padding:2px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-family:var(--mono);font-size:12px;color:var(--accent);cursor:pointer}
.lnk:hover{border-color:var(--accent)}
.lnk.ext{color:var(--ink2);cursor:default}
.src{font:12px/1.65 var(--mono);direction:ltr;text-align:left;white-space:pre}
.src div{display:flex;padding:0 6px;border-radius:3px;cursor:pointer}
.src div:hover{background:var(--panel2)}
.src div.hl{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.src b{font-weight:400;color:var(--ink3);width:38px;flex:none;text-align:right;padding-inline-end:10px;user-select:none}
.trail{display:flex;gap:4px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px}
.trail a{padding:2px 8px;border-radius:6px;background:var(--panel2);cursor:pointer;color:var(--ink2)}
.trail a.cur{background:var(--accent);color:var(--accent-ink);cursor:default}
.check{display:inline-flex;gap:6px;align-items:center;cursor:pointer;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.check input{accent-color:var(--c-call)}
#stepbar{position:absolute;inset-inline:12px;inset-block-end:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 auto;max-width:760px}
#stepbar .d{flex:1;min-width:200px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;max-width:320px;box-shadow:var(--shadow);display:none;white-space:pre-line}
#tip code{font-family:var(--mono)}
.cv text{font-family:var(--ui)}
@media(max-width:860px){#drawer{position:absolute;inset-block:0;inset-inline-start:0;width:min(94vw,400px);box-shadow:var(--shadow)}.fnbody{flex-direction:column}#side{width:auto;height:42%;border-inline-start:0;border-block-start:1px solid var(--line)}.progress i{display:none}}

.modal{position:fixed;inset:0;background:rgba(10,18,28,.55);display:grid;place-items:center;z-index:60;padding:16px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(580px,100%);max-height:88vh;overflow:auto;padding:18px}
.sheet h3{margin:0 0 6px}.sheet h4{margin:16px 0 4px;color:var(--ink2);font-weight:500}
.setrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-block-end:1px solid var(--line)}
.setrow input{margin-top:5px;accent-color:var(--accent)}
.soon{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--ink2);margin-inline-start:6px}
.note{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--card);display:grid;gap:4px}
.note .trg{font:600 13px var(--mono);direction:ltr;text-align:left;word-break:break-all}
.note .meta{font-size:11.5px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note .meta span{background:var(--panel2);padding:0 7px;border-radius:999px}
.note .meta button{border:0;background:none;color:var(--accent);padding:0 4px}
.mono{font-family:var(--mono);direction:ltr;text-align:left}
.runrow{display:flex;gap:8px;align-items:center;margin:6px 0}.runrow .mono{min-width:64px}.runrow input{flex:1;font-family:var(--mono);direction:ltr;text-align:left}
.steps{width:100%;border-collapse:collapse;font-size:12px}
.steps td{padding:3px 5px;border-block-end:1px solid var(--line);vertical-align:top}
.steps tr{cursor:pointer}.steps tr:hover,.steps tr.cur{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.steps .v{color:var(--c-if);font-family:var(--mono);direction:ltr;text-align:left}
.out{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:12px var(--mono);direction:ltr;text-align:left;white-space:pre-wrap;max-height:110px;overflow:auto}
#dfHint{position:absolute;inset-inline-start:12px;inset-block-start:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:12.5px;color:var(--ink2);max-width:360px;box-shadow:var(--shadow)}
.selpop{position:fixed;z-index:55;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:4px 10px;box-shadow:var(--shadow)}
.fld{display:grid;gap:4px}.fld label{font-size:12.5px;color:var(--ink2)}
textarea.note-in{min-height:64px;resize:vertical;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px}
#errbox{padding:10px 14px 0}
.errbox{border:1px solid var(--c-ret);border-inline-start-width:5px;border-radius:10px;background:color-mix(in srgb,var(--c-ret) 9%,var(--card));padding:10px 12px;display:grid;gap:5px;font-size:13px;margin:6px 0}
.errbox.warn{border-color:var(--c-if);background:color-mix(in srgb,var(--c-if) 10%,var(--card))}
.errbox.info{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.errbox b{font-weight:600}.errbox .hint{color:var(--ink2)}
.errbox details summary{cursor:pointer;color:var(--ink2);font-size:12.5px}
.errbox pre{margin:6px 0;white-space:pre-wrap;word-break:break-all;font-size:11.5px;max-height:140px;overflow:auto}
.toast{position:fixed;inset-inline:12px;inset-block-end:16px;margin:0 auto;max-width:520px;z-index:70;box-shadow:var(--shadow);cursor:pointer}
[dir=rtl] .flip svg{transform:scaleX(-1)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="svgcss">
.ov-edge{fill:none;stroke:var(--ink3);stroke-opacity:.6}
.ov-edge.x{stroke-dasharray:6 4}
.ov-edge.cyc{stroke:var(--c-ret);stroke-dasharray:2 3;stroke-opacity:.85}
.ov-edge.hi{stroke:var(--accent);stroke-opacity:1}
.ov-edge.dim,.ov-node.dim{opacity:.12}
.ov-lbl{font-size:10.5px;fill:var(--ink2);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.ov-node{cursor:pointer}
.ov-node .box{fill:var(--card);stroke:var(--line);stroke-width:1.3}
.ov-node:hover .box,.ov-node.match .box{stroke:var(--accent);stroke-width:2}
.ov-node.entry .box{stroke:var(--accent);stroke-width:1.8}
.ov-node .nm{font:500 12.5px var(--mono);fill:var(--ink)}
.ov-node .sub{font-size:10px;fill:var(--ink3)}
.ov-node.mod .box{stroke-dasharray:4 3}
.ar-ov{fill:var(--ink3)}
.tr-link{fill:none;stroke-linecap:round}
.tr-t{font-size:13px;fill:var(--ink)}
.tr-t.fn{font-family:var(--mono);cursor:pointer;font-size:12.5px}
.tr-t.fn:hover{fill:var(--accent)}
.tr-t.root{font-weight:600;font-size:15px}
.tr-ref{fill:var(--ink2)}
.tr-tg{cursor:pointer}
.fl-edge{fill:none;stroke:var(--ink3);stroke-width:1.6}
.fl-edge.l-true{stroke:var(--c-true)}.fl-edge.l-false{stroke:var(--c-false)}
.fl-edge.k-back{stroke:var(--c-loop);stroke-dasharray:5 4}
.fl-edge.k-exc{stroke:var(--c-try);stroke-dasharray:5 4}
.fl-edge.k-fall{stroke-dasharray:3 3}
.fl-edge.cur{stroke:var(--accent);stroke-width:3}
.fl-lbl{font:500 11px var(--mono);fill:var(--ink2);paint-order:stroke;stroke:var(--bg);stroke-width:4px}
.fl-lbl.l-true{fill:var(--c-true)}.fl-lbl.l-false{fill:var(--c-false)}.fl-lbl.k-back{fill:var(--c-loop)}.fl-lbl.k-exc{fill:var(--c-try)}
.ar-n{fill:var(--ink3)}.ar-true{fill:var(--c-true)}.ar-false{fill:var(--c-false)}.ar-loop{fill:var(--c-loop)}.ar-exc{fill:var(--c-try)}
.fl-edge{marker-end:url(#ar-n)}.fl-edge.l-true{marker-end:url(#ar-true)}.fl-edge.l-false{marker-end:url(#ar-false)}.fl-edge.k-back{marker-end:url(#ar-loop)}.fl-edge.k-exc{marker-end:url(#ar-exc)}
.ov-edge{marker-end:url(#ar-ov)}
.fl-node{cursor:pointer}
.fl-shape{fill:var(--card);stroke:var(--line);stroke-width:1.4}
.fl-node:hover .fl-shape{stroke:var(--accent)}
.fl-node.sel .fl-shape{stroke:var(--accent);stroke-width:2.6}
.fl-node.cur .fl-shape{stroke:var(--accent);stroke-width:3;filter:drop-shadow(0 0 7px var(--accent))}
.fl-node.vis .fl-shape{fill:color-mix(in srgb,var(--accent) 9%,var(--card))}
.fl-gut{fill:var(--gutter)}
.fl-ln{font:10.5px var(--mono);fill:var(--ink3);text-anchor:end}
.fl-code{font:12px var(--mono);fill:var(--ink);white-space:pre}
.fl-more{font:11px var(--mono);fill:var(--ink3)}
.t-stmt .fl-bar{fill:var(--c-stmt)}.t-if .fl-bar{fill:var(--c-if)}.t-loop .fl-bar{fill:var(--c-loop)}.t-switch .fl-bar,.t-case .fl-bar{fill:var(--c-switch)}
.t-try .fl-bar,.t-catch .fl-bar,.t-finally .fl-bar{fill:var(--c-try)}.t-return .fl-bar,.t-throw .fl-bar{fill:var(--c-ret)}.t-break .fl-bar,.t-continue .fl-bar{fill:var(--c-loop)}
.t-start .fl-shape{fill:var(--accent);stroke:var(--accent)}.t-end .fl-shape{fill:var(--ink2);stroke:var(--ink2)}
.t-start text,.t-end text{fill:var(--accent-ink);font:500 12px var(--mono)}
.t-if .fl-shape,.t-loop .fl-shape,.t-switch .fl-shape{stroke-width:1.8}
.t-if .fl-shape{stroke:var(--c-if)}.t-loop .fl-shape{stroke:var(--c-loop)}.t-switch .fl-shape{stroke:var(--c-switch)}
.t-try .fl-shape,.t-catch .fl-shape,.t-finally .fl-shape{stroke:var(--c-try);stroke-dasharray:6 3}
.t-return .fl-shape,.t-throw .fl-shape{stroke:var(--c-ret)}
.fl-node.hascall .fl-shape{stroke-opacity:1}
.chip-g{cursor:pointer}
.chip-g rect{fill:color-mix(in srgb,var(--c-call) 14%,var(--card));stroke:var(--c-call);stroke-width:1}
.chip-g:hover rect{fill:color-mix(in srgb,var(--c-call) 30%,var(--card))}
.chip-g text{font:11px var(--mono);fill:var(--ink)}
.tk-o{fill:var(--ink2);color:var(--ink2)}
.hastip{text-decoration:underline dotted var(--ink3);text-underline-offset:3px;cursor:help}
.hasnote{text-decoration:underline wavy var(--c-if);text-underline-offset:3px;cursor:help}
.chip-g.val{cursor:default}.chip-g.val rect{fill:color-mix(in srgb,var(--c-if) 14%,var(--card));stroke:var(--c-if);stroke-dasharray:3 2}
.visit rect{fill:var(--accent)}.visit text{fill:var(--accent-ink);font:600 10.5px var(--mono);text-anchor:middle}
.fl-edge.res{stroke:var(--c-call);stroke-dasharray:4 3;marker-end:url(#ar-true)}
.fl-lbl.res{fill:var(--c-call)}
.d-param .fl-bar{fill:var(--c-try)}.d-call .fl-bar{fill:var(--c-call)}.d-ext .fl-bar{fill:var(--ink3)}.d-assign .fl-bar{fill:var(--c-stmt)}.d-ret .fl-bar{fill:var(--c-ret)}
.d-cond .fl-shape{stroke:var(--c-if);stroke-width:1.8}.d-param .fl-shape{stroke:var(--c-try)}.d-ext .fl-shape{stroke-dasharray:4 3}
.d-call .nm{font:600 12px var(--mono);fill:var(--ink)}.d-sub{font:11px var(--mono);fill:var(--c-if)}
.tr-sub{font-size:11px;fill:var(--ink2)}
.fl-node.dsel .fl-shape{stroke:var(--accent);stroke-width:2.6}
.tk-k{fill:var(--tk-k);color:var(--tk-k)}.tk-s{fill:var(--tk-s);color:var(--tk-s)}.tk-c{fill:var(--tk-c);color:var(--tk-c);font-style:italic}
.tk-n{fill:var(--tk-n);color:var(--tk-n)}.tk-f{fill:var(--tk-f);color:var(--tk-f)}.tk-t{fill:var(--tk-t);color:var(--tk-t)}
</style>
</head>
<body>
<div id="app">
<header id="top">
  <button id="btnDrawer" class="ico" data-i="menu" data-ti="t_input"></button>
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="3.2" style="color:var(--accent)"/><circle cx="20" cy="9" r="3.2" style="color:var(--c-loop)"/><circle cx="10" cy="20" r="3.2" style="color:var(--c-call)"/><path d="M8.7 7.2l8.6 1.3M7.2 8.8l2 8.4M12.8 18.8l5.6-7.3"/></svg>
    <span>Codemap</span><small data-t="tagline"></small>
  </div>
  <div id="stats" class="stats"></div>
  <div class="grow"></div>
  <div class="progress" id="progress"><span id="progTxt"></span><i><b id="progBar"></b></i></div>
  <button id="btnLang" class="chip">EN</button>
  <button id="btnSet" class="ico" data-i="gear" data-ti="settings"></button>
  <button id="btnTheme" class="ico" data-i="moon"></button>
</header>
<main id="main">

 while((m=re.exec(code))){

  if(m[1]!==undefined)push('c',m[0]);
  else if(m[2]!==undefined)push('s',m[0]);

function cutTokens(tk,from,len){

 for(const t of tk){const a=pos,b=pos+t.v.length;pos=b;if(b<=from)continue;if(a>=end){cut=true;break}
  const s=Math.max(from,a)-a,e=Math.min(end,b)-a;if(e<t.v.length)cut=true;out.push({c:t.c,v:t.v.slice(s,e)})}

 if(cut)out.push({c:'c',v:'…'});

JavaScript:`// order processing
const TAX = 0.15;

function processOrder(order) {
  if (!validate(order)) {
    report("invalid order", order.id);
    return null;
  }
  let total = calcTotal(order.items);
  total = applyDiscount(total, order.coupon);
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const receipt = charge(order.card, total);
      notify(order.email, receipt);
      return receipt;
    } catch (err) {
      report(err.message, order.id);
      if (attempt === 3) throw err;
    }
  }
}

function validate(order) {
  if (!order || !order.items.length) return false;
  return checkCard(order.card);
}

function checkCard(card) {
  let sum = 0;
  let i = card.length - 1;
  while (i >= 0) {
    sum += Number(card[i]);
    i -= 2;
  }
  return sum % 10 === 0;
}

function calcTotal(items) {
  let total = 0;
  for (const item of items) {
    if (item.qty <= 0) continue;
    total += item.price * item.qty;
  }
  return total * (1 + TAX);
}

function applyDiscount(total, coupon) {
  switch (coupon) {
    case "HALF":
      return total / 2;
    case "TEN":
      return total * 0.9;
    case "FREE":
      return 0;
    default:
      return total;
  }
}

function charge(card, amount) {
  if (amount === 0) return "free-" + Date.now();
  if (!checkCard(card)) throw new Error("card rejected");
  return "paid-" + amount.toFixed(2);
}

function notify(email, receipt) {
  report("sent " + receipt, email);
}

function report(msg, ref) {
  console.error("[" + ref + "] " + msg);
}

const result = processOrder({ id: 7, items: [{ price: 20, qty: 2 }], coupon: "TEN", card: "4242", email: "a@b.c" });

Python:`def analyze(numbers):
    if not numbers:
        return None
    avg = mean(numbers)
    spread = variance(numbers, avg)
    label = classify(spread)
    print(label)
    return avg, spread


def mean(xs):
    total = 0
    for x in xs:
        total += x
    return total / len(xs)


def variance(xs, avg):
    acc = 0
    i = 0
    while i < len(xs):
        acc += (xs[i] - avg) ** 2
        i += 1
    return acc / len(xs)


def classify(v):
    if v < 1:
        return "stable"
    elif v < 10:
        return "normal"
    else:
        return "wild"


def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)

    print(fib(8))

func main() {
	nums := []int{3, 8, 1}
	sorted := sortInts(nums)
	if len(sorted) > 0 {
		report(sorted[0])
	}
}

func sortInts(a []int) []int {
	for i := 0; i < len(a); i++ {
		for j := i + 1; j < len(a); j++ {
			if a[j] < a[i] {
				swap(a, i, j)
			}
		}
	}
	return a
}

func swap(a []int, i, j int) {
	a[i], a[j] = a[j], a[i]
}

}

/* ================= statement explanations ================= */
function outerCalls(fn,s,e){
 const P=state.P,F=fn.file,m=F.m;
 const calls=extractCalls(m,s,e).map(c=>Object.assign(c,{close:matchClose(m,c.open)})).filter(c=>c.close>0&&c.close<=e);
 const out=[];
 for(const c of calls){if(calls.some(o=>o!==c&&o.open<c.idx&&o.close>c.close))continue;
  const ids=resolveCall(P,c,fn);out.push({name:c.name,id:ids&&ids.length?ids[0]:null,qname:ids&&ids.length?P.funcs[ids[0]].qname:c.name,args:short(clean(F,c.open+1,c.close),28),c});}
 return out;
}
function singleCall(fn,s,e,pa){
 const F=fn.file,m=F.m,calls=outerCalls(fn,s,e);if(calls.length!==1)return null;
 const c=calls[0].c,rs=s+pa.endIdx,pre=m.slice(rs,c.idx).trim(),after=m.slice(c.close+1,e).trim().replace(/;$/,'');
 return /^(?:await\s+|new\s+)*[\w$.]*$/.test(pre)&&!after?calls[0]:null;
}
function explainStmt(fn,s){
 const F=fn.file,m=F.m,cl=(a,b)=>short(clean(F,a,b).replace(/;$/,''),44);
 switch(s.t){
  case'if':return t('x_if',cl(s.cs,s.ce));
  case'loop':case'dowhile':return t('x_loop',s.kind,cl(s.cs,s.ce));
  case'switch':return t('x_switch',cl(s.cs,s.ce));
  case'try':return t('x_try');
  case'return':{const x=clean(F,s.s,s.e).replace(/^return\s*/,'').replace(/;$/,'');return x?t('x_return',short(x,40)):t('x_return0')}
  case'throw':return t('x_throw');case'break':return t('x_break');case'continue':return t('x_continue');
 }
 const txt=m.slice(s.s,s.e),pa=parseAssign(txt);
 if(pa){const sc=singleCall(fn,s.s,s.e,pa);const v=pa.vars.join(', ');
  if(sc)return t('x_assign_call',v,sc.qname);
  return t('x_assign',v,short(clean(F,s.s+pa.endIdx,s.e).replace(/;$/,''),36))}
 const cs=outerCalls(fn,s.s,s.e);if(cs.length)return t('x_call',cs.map(c=>c.qname).join(', '));
 return '';
}

/* ================= outline (meaningful steps) ================= */
function buildOutline(fn){
 const F=fn.file,ast=getAst(fn),col=n=>`var(${TYCOL[n]})`;
 const lbl=(s,e)=>short(clean(F,s,e).replace(/;$/,''),48);
 const conv=list=>{
  const out=[];
  for(const s of list){
   const ln=F.lineAt(s.s),click=()=>selectByLine(ln);
   const mk=(label,type,children)=>({label,sub:explainStmt(fn,s),color:col(type),onClick:click,children:children||[]});
   const grp=(label,type,body,l)=>({label,color:col(type),onClick:()=>selectByLine(l||ln),children:conv(body)});
   if(s.t==='if'){const kids=[grp(t('x_true'),'if',s.body)];if(s.else)kids.push(grp(t('x_false'),'if',s.else));out.push(mk('if '+short(clean(F,s.cs,s.ce),44),'if',kids))}
   else if(s.t==='loop'||s.t==='dowhile')out.push(mk(`${s.kind} ${short(clean(F,s.cs,s.ce),40)}`,'loop',conv(s.body)));
   else if(s.t==='switch')out.push(mk(`${s.kw} ${short(clean(F,s.cs,s.ce),40)}`,'switch',s.cases.map(c=>({label:c.def?'default':'case '+short(clean(F,c.cs,c.ce),30),color:col('switch'),onClick:()=>selectByLine(F.lineAt(c.ls)),children:conv(c.body)}))));
   else if(s.t==='try'){const kids=[grp('try','try',s.body)];for(const c of s.catches)kids.push(grp('catch '+short(clean(F,c.cs,c.ce),30),'try',c.body,F.lineAt(c.ls)));if(s.fin)kids.push(grp('finally','try',s.fin.body,F.lineAt(s.fin.ls)));out.push(mk('try','try',kids))}
   else{
    const node=mk(lbl(s.s,s.e),s.t),pa=s.t==='stmt'?parseAssign(F.m.slice(s.s,s.e)):null;
    const sc=pa?singleCall(fn,s.s,s.e,pa):null;
    for(const c of outerCalls(fn,s.s,s.e)){if(c.id==null)continue;
     node.children.push({label:`${c.qname}(${c.args})`+(sc&&sc.id===c.id?' → '+pa.vars.join(', '):''),fnId:c.id,color:'var(--c-call)',children:[]})}
    out.push(node);
   }
  }
  return out;
 };
 const root={label:fn.qname,root:true,rowH:48,sub:paramNames(fn).length?t('x_in',paramNames(fn).join(', ')):'',children:conv(ast)};
 return root;
}

/* ================= data flow ================= */
function buildDataflow(P,fn){
 const F=fn.file,m=F.m,ast=getAst(fn);
 const nodes=[],edges=[],ek=new Set(),cache=new Map();
 const node=(key,mk)=>{let n=cache.get(key);if(!n){n=Object.assign({id:nodes.length},mk());nodes.push(n);cache.set(key,n)}return n};
 const edge=(a,b,label,kind)=>{if(a===b)return;const k=a+'>'+b+':'+label;if(ek.has(k))return;ek.add(k);edges.push({from:a,to:b,label,kind:kind||''})};
 const cloneEnv=e=>{const c=new Map();for(const[k,v]of e)c.set(k,new Set(v));return c};
 const mergeEnv=(a,b)=>{const c=cloneEnv(a);for(const[k,v]of b){if(!c.has(k))c.set(k,new Set());for(const x of v)c.get(k).add(x)}return c};
 const useVars=(str,env)=>{const seen=new Set();for(const id of idents(str.replace(/\.\s*[A-Za-z_$][\w$]*/g,' ')))if(env.has(id))seen.add(id);return seen};
 const blank=(str,a,b)=>str.slice(0,a)+' '.repeat(Math.max(0,b-a))+str.slice(b);
 let env=new Map();
 for(const p of paramNames(fn)){const n=node('p:'+p,()=>({type:'param',text:p,line:fn.line}));env.set(p,new Set([n]))}
 function proc(s,e,kind,env,label){
  const txt=m.slice(s,e);
  const calls=extractCalls(m,s,e).map(c=>Object.assign(c,{close:matchClose(m,c.open)})).filter(c=>c.close>0&&c.close<=e);
  for(const c of calls){let par=null;for(const o of calls)if(o!==c&&o.open<c.idx&&o.close>c.close&&(!par||o.open>par.open))par=o;c.parent=par}
  const cn=new Map();
  for(const c of calls){
   const ids=resolveCall(P,c,fn),isInt=!!(ids&&ids.length);
   cn.set(c,node('c:'+c.idx,()=>({type:isInt?'call':'ext',text:isInt?P.funcs[ids[0]].qname:c.name,fnId:isInt?ids[0]:null,args:short(clean(F,c.open+1,c.close),30),line:F.lineAt(c.idx)})));
  }
  for(const c of calls){
   let a=m.slice(c.open+1,c.close);
   for(const o of calls)if(o.parent===c)a=blank(a,o.idx-(c.open+1),o.close+1-(c.open+1));
   const nd=cn.get(c);
   for(const v of useVars(a,env))for(const d of env.get(v))edge(d.id,nd.id,v);
   if(c.dot&&c.obj&&env.has(c.obj))for(const d of env.get(c.obj))edge(d.id,nd.id,c.obj);
   if(c.parent)edge(nd.id,cn.get(c.parent).id,'__res','res');
  }
  const outer=calls.filter(c=>!c.parent);
  let outside=txt;for(const c of outer)outside=blank(outside,c.idx-s,c.close+1-s);
  if(kind==='stmt'){
   const pa=parseAssign(txt);if(!pa)return null;
   const sc=singleCall(fn,s,e,pa);let def;

function errCard(info,level='err'){
 const c=H('div',{class:'errbox '+level},H('b',{text:info.title}));
 if(info.detail)c.append(H('div',{text:info.detail}));
 if(info.hint)c.append(H('div',{class:'hint',text:info.hint}));
 if(info.actions&&info.actions.length)c.append(H('div',{class:'row'},...info.actions.map(a=>H('button',{class:'chip',text:a.label,onclick:a.fn}))));
 if(info.tech)c.append(H('details',{},H('summary',{text:t('e_tech')}),H('pre',{class:'mono',text:info.tech}),H('button',{class:'chip',text:t('e_copy'),onclick:()=>{try{navigator.clipboard.writeText(info.tech)}catch(e){}}})));
 return c;
}
function showError(info,level){const b=$('#errbox');b.innerHTML='';b.hidden=false;b.append(errCard(info,level||'err'))}
function clearError(){const b=$('#errbox');b.hidden=true;b.innerHTML=''}
function toast(text,level='info'){const el=H('div',{class:'errbox toast '+level,onclick:()=>el.remove()},H('div',{text}));document.body.append(el);setTimeout(()=>el.remove(),8000)}
function errInfo(e,ctx){
 ctx=ctx||{};
 if(!(e instanceof AppError))return{title:t('e_unknown'),detail:String(e&&e.message||e),tech:e&&e.stack||String(e)};
 const p=e.p,retry=ctx.retry?[{label:t('e_retry'),fn:ctx.retry}]:[];
 const focus=sel=>({label:'↳',fn:()=>$(sel).focus()});
 switch(e.code){
  case'gh_empty_input':return{title:t('gh_empty_input'),hint:t('gh_empty_input_h')};
  case'gh_badurl':return{title:t('gh_badurl'),detail:p.raw,hint:t('gh_badurl_h')};
  case'gh_notfound':return{title:p.ref&&p.ref.br?t('gh_nobranch',p.ref.br):t('gh_notfound'),detail:p.ref?`${p.ref.o}/${p.ref.r}`:'',hint:p.ref&&p.ref.via==='pages'?t('gh_notfound_h2'):t('gh_notfound_h1'),actions:retry};
  case'gh_ratelimit':return{title:t('gh_ratelimit'),detail:t('gh_ratelimit_d',p.reset?p.reset.toLocaleTimeString():'?'),hint:t('gh_ratelimit_h'),actions:[{label:'Token',fn:()=>$('#ghTok').focus()},...retry]};
  case'gh_auth':return{title:t('gh_auth'),hint:t('gh_auth_h'),actions:[{label:'Token',fn:()=>$('#ghTok').focus()}]};
  case'gh_net':return{title:t('gh_net'),hint:t('gh_net_h'),tech:p.tech,actions:retry};
  case'gh_http':return{title:t('gh_http',p.status),hint:t('gh_http_h'),tech:p.tech,actions:retry};
  case'gh_empty_repo':return{title:t('gh_empty_repo')};
  case'gh_nofiles':return{title:t('gh_nofiles'),detail:p.types?t('gh_types',p.types):'',hint:p.skipped?t('gh_tests_h'):t('gh_nofiles_h')};
  case'gh_allfail':return{title:t('gh_allfail'),detail:t('gh_allfail_d',p.n,p.last),hint:t('gh_allfail_h'),actions:retry};
  case'empty_paste':return{title:t('empty_paste'),hint:t('empty_paste_h')};
  case'no_functions':return{title:t('no_functions'),detail:t('no_functions_d',p.lang),hint:t('no_functions_h'),actions:[{label:t('pickLang'),fn:()=>{$('#lang').focus();$$('#drawer .tabs [data-tab]').find(b=>b.dataset.tab==='paste').click()}}]};
  case'file_none':return{title:t('file_none'),detail:t('file_none_d',p.types),hint:t('gh_nofiles_h')};
  case'analyze_fail':return{title:t('analyze_fail'),hint:t('analyze_fail_h'),tech:p.tech};
 }
 return{title:t('e_unknown'),detail:e.code,tech:e.stack};
}
function runErrInfo(m){
 m=String(m||'');
 if(/step limit/.test(m))return{title:t('r_limit'),hint:t('r_limit_h'),tech:m};
 if(/SyntaxError|Unexpected token|Unexpected identifier/.test(m))return{title:t('r_syntax'),detail:m,hint:t('r_syntax_h'),tech:m};
 if(/is not defined|NameError/.test(m))return{title:t('r_undef'),detail:m,hint:t('r_undef_h'),tech:m};
 if(/Pyodide|Failed to fetch|NetworkError/.test(m))return{title:t('r_py'),hint:t('r_py_h'),tech:m};
 return{title:t('runErr'),detail:m,hint:t('r_inputs_h'),tech:m};
}

/* ================= GitHub loader ================= */
const MAX_FILE=1500000;
function parseRepoUrl(raw){
 raw=(raw||'').trim();if(!raw)throw new AppError('gh_empty_input');
 const u=raw.replace(/^git@github\.com:/,'https://github.com/').replace(/\.git(?=$|[#?\/])/,'');
 let m=/github\.com\/([^\/\s]+)\/([^\/\s#?]+)(?:\/(?:tree|blob)\/([^\/\s]+)(?:\/([^\s#?]*))?)?/i.exec(u);
 if(m)return{o:m[1],r:m[2],br:m[3]||null,sub:(m[4]||'').replace(/\/$/,''),via:'repo'};
 m=/^(?:https?:\/\/)?([\w-]+)\.github\.io(?:\/([^\/\s#?]+))?/i.exec(u);
 if(m)return{o:m[1],r:m[2]||(m[1]+'.github.io'),br:null,sub:'',via:'pages'};
 m=/^([\w.-]+)\/([\w.-]+)$/.exec(u);
 if(m)return{o:m[1],r:m[2],br:null,sub:'',via:'repo'};
 throw new AppError('gh_badurl',{raw});
}
async function ghFetch(url,opts,ref){
 let res;try{res=await fetch(url,opts)}catch(e){throw new AppError('gh_net',{tech:String(e)})}
 if(res.ok)return res;
 const st=res.status;
 if(st===404)throw new AppError('gh_notfound',{ref});
 if(st===401)throw new AppError('gh_auth');
 if(st===403||st===429){const rem=res.headers.get('x-ratelimit-remaining'),rs=res.headers.get('x-ratelimit-reset');
  if(rem==='0'||st===429)throw new AppError('gh_ratelimit',{reset:rs?new Date(+rs*1000):null})}
 throw new AppError('gh_http',{status:st,tech:`${st} ${url}`});
}
async function loadGithub(){
 const bar=$('#ghBar'),log=$('#ghLog');clearError();bar.style.width='0';log.textContent='';
 try{
  const ref=parseRepoUrl($('#ghUrl').value);
  if(ref.via==='pages'){$('#ghUrl').value=`${ref.o}/${ref.r}`;toast(t('gh_pages',ref.o,ref.r),'info')}
  const tok=$('#ghTok').value.trim(),hd={Accept:'application/vnd.github+json'};if(tok)hd.Authorization='Bearer '+tok;
  log.textContent=t('gh_tree');
  const tr=await ghFetch(`https://api.github.com/repos/${ref.o}/${ref.r}/git/trees/${encodeURIComponent(ref.br||'HEAD')}?recursive=1`,{headers:hd},ref);
  const j=await tr.json(),blobs=(j.tree||[]).filter(x=>x.type==='blob');
  if(!blobs.length)throw new AppError('gh_empty_repo');
  const skipT=$('#ghTests').checked;let skipped=0,big=0;
  const isTest=p=>/(^|\/)(tests?|__tests__|spec|e2e|testdata)\//i.test(p)||/(\.test\.|\.spec\.|_test\.|Test\.java$)/.test(p);
  let items=blobs.filter(x=>{
   if(!langOfPath(x.path))return false;
   if(ref.sub&&!x.path.startsWith(ref.sub+'/'))return false;
   if(/(^|\/)(node_modules|dist|build|vendor|third_party|__pycache__|target|out|\.git)\//.test(x.path)||/\.min\.js$|\.d\.ts$|\.pb\.go$/.test(x.path))return false;
   if(skipT&&isTest(x.path)){skipped++;return false}
   if((x.size||0)>MAX_FILE){big++;return false}
   return true});
  if(!items.length){const cnt={};blobs.forEach(x=>{const e=(x.path.split('.').pop()||'').toLowerCase();cnt[e]=(cnt[e]||0)+1});
   throw new AppError('gh_nofiles',{types:Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`${k}×${v}`).join(', '),skipped})}
  items.sort((a,b)=>a.path.split('/').length-b.path.split('/').length||a.path.localeCompare(b.path));
  const max=clamp(+$('#ghMax').value||80,5,400),total=items.length;items=items.slice(0,max);
  const files=[],q=items.slice();let done=0,failed=0,last='';
  const worker=async()=>{while(q.length){const it=q.shift();
   try{const enc=it.path.split('/').map(encodeURIComponent).join('/'),rf=encodeURIComponent(ref.br||'HEAD');
    const res=tok?await fetch(`https://api.github.com/repos/${ref.o}/${ref.r}/contents/${enc}?ref=${rf}`,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github.raw+json'}}):await fetch(`https://raw.githubusercontent.com/${ref.o}/${ref.r}/${rf}/${enc}`);
    if(res.ok)files.push({path:it.path,code:await res.text()});else{failed++;last=res.status}}catch(e){failed++;last=String(e)}
   done++;bar.style.width=(100*done/items.length)+'%';log.textContent=t('gh_files',done,items.length)}};
  await Promise.all(Array.from({length:6},worker));
  if(!files.length)throw new AppError('gh_allfail',{n:items.length,last});
  files.sort((a,b)=>a.path.localeCompare(b.path));
  log.textContent=total>items.length?t('gh_cut',items.length,total):'';
  if(failed)toast(t('gh_partial',failed,items.length),'warn');
  if(j.truncated)toast(t('gh_trunc'),'warn');
  if(big)toast(t('gh_big',big),'warn');
  runAnalyze(files,`${ref.o}/${ref.r}`);
 }catch(e){showError(errInfo(e,{retry:loadGithub}));log.textContent='';bar.style.width='0'}
}
$('#ghGo').addEventListener('click',loadGithub);
